name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0891B2&color_dots=#ebedf0,#a5b4fc,#818cf8,#6366f1,#0891B2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#10B981&color_dots=#2d3343,#4b5563,#7C3AED,#A78BFA,#22D3EE

      # The FIRST colour in color_dots is the EMPTY cell. For the dark snake it
      # has to be a visible slate (#2d3343) -- against GitHub's own #0d1117 a
      # near-black empty cell disappears and the contribution grid looks broken
      # rather than empty.
      #
      # color_snake MUST carry a LITERAL hash, exactly like color_dots does.
      # snk copies the value straight into a CSS custom property without
      # normalising it, so:
      #     color_snake=10B981    -> --cs:10B981     invalid CSS, snake vanishes
      #     color_snake=%2310B981 -> --cs:10B981     %23 is not decoded either
      #     color_snake=#10B981   -> --cs:#10B981    correct
      # Verified by reading the :root block of the generated SVG. Worth knowing
      # that #1b1f23 in the output is a red herring -- that is --cb, the cell
      # border, not the snake.

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
